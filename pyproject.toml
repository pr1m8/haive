[tool.poetry.extras]
cpu = ["torch", "torchvision", "torchaudio"]
cuda = ["torch", "torchvision", "torchaudio"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts"]
skips = ["B101", "B311"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false, disallow_incomplete_defs = false },
]

[tool.doc8]
max-line-length = 100
ignore-path = ["docs/build", "*.egg-info", "**/__pycache__", ".git"]
file-encoding = "utf-8"
ignore = ["D001", "D002", "D004"]                                    # Ignore some line length warnings

[tool.codespell]
skip = "*.json,*.csv,poetry.lock,.git,*.pyc,*.pyo,*.egg-info,docs/build"
ignore-words-list = "haive,agentic,nd,te,ot,od,ue"
count = true
quiet-level = 2

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "ISC",
  "G",
  "PIE",
  "T20",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "ERA",
  "PL",
  "TRY",
  "RUF",
  "TID252",
]
ignore = ["E501", "D100", "D104", "D107", "D203", "D213", "RET504", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLR2004"]
"examples/**/*.py" = ["D", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12


[tool.ruff.lint.isort]
known-first-party = ["haive"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2
[tool.trailrunner]
# Instruct Trailrunner to skip any .cache/trunk or .trunk directories
exclude = ["**/.cache/trunk/**", "**/.trunk/**"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
