[tool.poetry]
name = "haive"
version = "0.1.0"
description = "Package for langgraph agents"
authors = ["0rac130fD31phi <william.astley@algebraicwealth.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.4"
langchain-core = "^0.3.35"
langchain = "^0.3.18"
langchain-community = "^0.3.17"
langchain-experimental = "^0.3.4"
tavily-python = "^0.5.1"
langgraph-checkpoint-postgres = "^2.0.15"
langgraph = "^0.2.73"
graphviz = {version = "^0.20.3", source = "pypi"}
matplotlib = "^3.10.0"
ipython = "^8.32.0"
langchain-openai = "^0.3.6"
wikipedia = "^1.4.0"
arxiv = "^2.1.3"
boto3 = "^1.36.22"
telethon = "^1.38.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
