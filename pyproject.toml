[tool.poetry]
name = "haive"
version = "0.1.0"
description = "Advanced AI Agent Framework with auto-persistence, multi-agent coordination, and rich tool ecosystem"
authors = ["pr1m8 <william.astley@algebraicwealth.com>"]
license = "MIT"
readme = "README.md"
package-mode = false
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
repository = "https://github.com/prim8/haive"
homepage = "https://haive.readthedocs.io"
documentation = "https://haive.readthedocs.io"
keywords = ["ai", "agents", "llm", "language models", "langgraph"]


[tool.pytest.ini_options]
pythonpath = [
  "packages/haive-core/src",
  "packages/haive-agents/src",
  "packages/haive-tools/src",
  "packages/haive-games/src",
  "packages/haive-dataflow/src",
  "packages/haive-prebuilt/src",
]


[tool.poetry.scripts]
haive = "haive.main:main" # only if you want CLI support

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[[tool.poetry.source]]
name = "nvidia"
url = "https://pypi.ngc.nvidia.com"
priority = "supplemental"

