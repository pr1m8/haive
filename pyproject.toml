[tool.poetry.extras]
# Package groups
agents = ["haive-agents"]
tools = ["haive-tools"]
games = ["haive-games"]
dataflow = ["haive-dataflow"]
prebuilt = ["haive-prebuilt"]
all-packages = ["haive-agents", "haive-tools", "haive-games", "haive-dataflow", "haive-prebuilt"]

# Core utilities
core-utils = [
    "langchain-community", "langchain-experimental", "jsonpatch", "dill", 
    "nest-asyncio", "setuptools", "numexpr", "json-repair", "networkx", 
    "ujson", "toml", "astor"
]

# LLM providers
llm-openai = ["langchain-openai"]
llm-anthropic = ["langchain-anthropic"]
llm-google = ["langchain-google-genai"]
llm-opensource = ["langchain-ollama", "langchain-groq", "langchain-together", "langchain-fireworks"]
llm-all = [
    "langchain-openai", "langchain-anthropic", "langchain-deepseek", "langchain-google-genai",
    "langchain-mistralai", "langchain-nvidia-ai-endpoints", "langchain-groq", "langchain-together",
    "langchain-fireworks", "langchain-ollama"
]

# Database options
db-postgres = ["langgraph-checkpoint-postgres", "psycopg2", "psycopg", "psycopg-pool", "asyncpg"]
db-mongodb = ["langgraph-checkpoint-mongodb", "langchain-mongodb"]
db-neo4j = ["neo4j", "langchain-neo4j"]
db-supabase = ["supabase"]
db-all = [
    "langgraph-checkpoint-postgres", "langgraph-checkpoint-mongodb", "langchain-mongodb",
    "neo4j", "langchain-neo4j", "psycopg2", "psycopg", "psycopg-pool", "asyncpg", "supabase"
]

# Web framework options
web = ["fastapi", "uvicorn", "websocket"]

# Search and retrieval
search-basic = ["tavily-python", "duckduckgo-search", "wikipedia", "arxiv"]
search-advanced = ["google-search-results", "serpapi", "youtube-search", "youtube-transcript-api", "pytube"]
search-ml = ["rank-bm25", "flashrank", "ragatouille"]
search-all = [
    "tavily-python", "arxiv", "wikipedia", "duckduckgo-search", "google-search-results",
    "serpapi", "youtube-search", "youtube-transcript-api", "pytube", "rank-bm25",
    "flashrank", "ragatouille"
]

# Vector stores
vectorstores = ["qdrant-client", "simsimd"]

# Document processing
docs-basic = ["lxml", "html2text", "markdownify", "xmltodict"]
docs-pdf = ["pdfplumber", "pdfminer-six", "pdfminer", "pymupdf"]
docs-advanced = ["langchain-docling", "openpyxl", "mwparserfromhell", "sqlparse"]
docs-all = [
    "lxml", "html2text", "markdownify", "langchain-docling", "pdfplumber",
    "pdfminer-six", "pdfminer", "pymupdf", "openpyxl", "mwparserfromhell",
    "sqlparse", "xmltodict"
]

# Data science
data-science = ["pandas", "matplotlib", "scikit-learn", "ipython", "ipykernel"]

# Web automation
automation = ["playwright", "playwright-stealth"]

# Communication platforms
comms-discord = ["discord", "langchain-discord", "langchain-discord-shikenso"]
comms-other = ["twilio", "telethon"]
comms-all = ["discord", "langchain-discord", "langchain-discord-shikenso", "twilio", "telethon"]

# Third-party integrations
integrations-google = ["google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib"]
integrations-aws = ["boto3"]
integrations-business = ["stripe-agent-toolkit", "langchain-salesforce"]
integrations-gaming = ["python-steam-api", "python-decouple"]
integrations-all = [
    "boto3", "google-api-python-client", "google-auth-httplib2", "google-auth-oauthlib",
    "stripe-agent-toolkit", "langchain-salesforce", "python-steam-api", "python-decouple"
]

# Translation
translation = ["googletrans", "deepl"]

# Code parsing
code-parsing = ["esprima", "tree-sitter", "tree-sitter-languages"]

# Memory and analytics
analytics = ["zep-python", "prometheus-client"]

# UI
ui = ["gradio"]

# Games
games-chess = ["chess"]

# Testing
testing = ["pytest", "rich"]

# MCP
mcp = ["mcp", "langchain-mcp-adapters"]

# Common development setup
dev = [
    "haive-agents", "haive-tools", "core-utils", "llm-openai", "llm-anthropic",
    "search-basic", "docs-basic", "testing", "web"
]

# Full installation
full = [
    "all-packages", "core-utils", "llm-all", "db-all", "web", "search-all",
    "vectorstores", "docs-all", "data-science", "automation", "comms-all",
    "integrations-all", "translation", "code-parsing", "analytics", "ui",
    "games-chess", "testing", "mcp"
]

# Torch extras (kept for compatibility)
cpu = ["torch", "torchvision", "torchaudio"]
cuda = ["torch", "torchvision", "torchaudio"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts"]
skips = ["B101", "B311"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false, disallow_incomplete_defs = false },
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "T10",
  "ISC",
  "G",
  "PIE",
  "T20",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SIM",
  "ARG",
  "ERA",
  "PL",
  "TRY",
  "RUF",
]
ignore = ["E501", "D100", "D104", "D107", "D203", "D213", "RET504", "TRY003"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLR2004"]
"examples/**/*.py" = ["D", "T20"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.mccabe]
max-complexity = 12


[tool.ruff.isort]
known-first-party = ["haive"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
