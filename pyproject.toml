[tool.poetry]
name = "haive"
version = "0.1.0"
description = "Package for langgraph agents"
authors = ["pr1m8 <william.astley@algebraicwealth.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
repository = "https://github.com/prim8/haive"
homepage = "https://haive.readthedocs.io"
documentation = "https://haive.readthedocs.io"
keywords = ["ai", "agents", "llm", "language models", "langgraph"]


[tool.pytest.ini_options]
pythonpath = [
  "packages/haive-core/src",
  "packages/haive-agents/src",
  "packages/haive-tools/src",
  "packages/haive-games/src",
  "packages/haive-dataflow/src",
  "packages/haive-prebuilt/src",
  "packages/haive-mcp/src",
]


[tool.poetry.scripts]
haive = "haive.main:main" # only if you want CLI support

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[[tool.poetry.source]]
name = "nvidia"
url = "https://pypi.ngc.nvidia.com"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# Core framework dependencies (always installed)
langchain-core = "^0.3.63"
langchain = "^0.3.20"
pydantic = "^2.10.6"
langgraph = "^0.3.5"

# Haive packages
haive-core = { path = "packages/haive-core", develop = true }
haive-agents = { path = "packages/haive-agents", develop = true, optional = true }
haive-dataflow = { path = "packages/haive-dataflow", develop = true, optional = true }
haive-games = { path = "packages/haive-games", develop = true, optional = true }
haive-prebuilt = { path = "packages/haive-prebuilt", develop = true, optional = true }
haive-tools = { path = "packages/haive-tools", develop = true, optional = true }

# Core utilities (optional)
langchain-community = { version = "^0.3.20", optional = true }
langchain-experimental = { version = "^0.3.4", optional = true }
jsonpatch = { version = "^1.33", optional = true }
dill = { version = "0.3.8", optional = true }
nest-asyncio = { version = "^1.6.0", optional = true }
setuptools = { version = "^75.8.0", optional = true }
numexpr = { version = "^2.10.2", optional = true }
json-repair = { version = "^0.39.0", optional = true }
networkx = { version = "^3.4.2", optional = true }
ujson = { version = "^5.10.0", optional = true }
toml = { version = "^0.10.2", optional = true }
astor = { version = "^0.8.1", optional = true }

# LLM providers (optional)
langchain-openai = { version = "<=0.3.6", optional = true }
langchain-anthropic = { version = "^0.3.10", optional = true }
langchain-deepseek = { version = "^0.1.2", optional = true }
langchain-google-genai = { version = "^2.1.0", optional = true }
langchain-mistralai = { version = "^0.2.8", optional = true }
langchain-nvidia-ai-endpoints = { version = "^0.3.9", optional = true }
langchain-groq = { version = "^0.3.1", optional = true }
langchain-together = { version = "^0.3.0", optional = true }
langchain-fireworks = { version = "^0.2.8", optional = true }
langchain-ollama = { version = "^0.3.0", optional = true }

# Database and persistence (optional)
langgraph-checkpoint-postgres = { version = "^2.0.15", optional = true }
langgraph-checkpoint-mongodb = { version = "^0.1.3", optional = true }
langchain-mongodb = { version = "^0.5.0", optional = true }
neo4j = { version = "^5.28.1", optional = true }
langchain-neo4j = { version = "^0.3.0", optional = true }
psycopg2 = { version = "^2.9.10", optional = true }
psycopg = { version = "^3.2.6", optional = true }
psycopg-pool = { version = "^3.2.6", optional = true }
asyncpg = { version = "^0.30.0", optional = true }
supabase = { version = "^2.15.0", optional = true }

# Web and API frameworks (optional)
fastapi = { version = "^0.115.12", optional = true }
uvicorn = { version = "^0.34.0", optional = true }
websocket = { version = "^0.2.1", optional = true }

# Search and retrieval (optional)
tavily-python = { version = "^0.5.1", optional = true }
arxiv = { version = "^2.1.3", optional = true }
wikipedia = { version = "^1.4.0", optional = true }
duckduckgo-search = { version = "^7.5.2", optional = true }
google-search-results = { version = "^2.4.2", optional = true }
serpapi = { version = "^0.1.5", optional = true }
youtube-search = { version = "^2.1.2", optional = true }
youtube-transcript-api = { version = "^1.0.3", optional = true }
pytube = { version = "^15.0.0", optional = true }
rank-bm25 = { version = "^0.2.2", optional = true }
flashrank = { version = "^0.2.10", optional = true }
ragatouille = { version = "^0.0.9", optional = true }

# Vector stores (optional)
qdrant-client = { version = "^1.13.3", optional = true }
simsimd = { version = "^6.2.1", optional = true }

# Document processing (optional)
lxml = { version = "^5.3.1", optional = true }
html2text = { version = "^2024.2.26", optional = true }
markdownify = { version = "^1.1.0", optional = true }
langchain-docling = { version = "^0.2.0", optional = true }
pdfplumber = { version = "^0.11.6", optional = true }
pdfminer-six = { version = "^20250327", optional = true }
pdfminer = { version = "^20191125", optional = true }
pymupdf = { version = "^1.25.5", optional = true }
openpyxl = { version = "^3.1.5", optional = true }
mwparserfromhell = { version = "^0.6.6", optional = true }
sqlparse = { version = "^0.5.3", optional = true }
xmltodict = { version = "^0.14.2", optional = true }

# Data science and visualization (optional)
pandas = { version = "^2.2.3", optional = true }
matplotlib = { version = "^3.10.0", optional = true }
scikit-learn = { version = "^1.6.1", optional = true }
ipython = { version = "^8.32.0", optional = true }
ipykernel = { version = "^6.29.5", optional = true }

# Web scraping and automation (optional)
playwright = { version = "^1.50.0", optional = true }
playwright-stealth = { version = "^1.0.6", optional = true }

# Communication platforms (optional)
discord = { version = "^2.3.2", optional = true }
langchain-discord = { version = "^1.0.2", optional = true }
langchain-discord-shikenso = { version = "^1.1.1", optional = true }
twilio = { version = "^9.5.1", optional = true }
telethon = { version = "^1.38.1", optional = true }

# Third-party integrations (optional)
boto3 = { version = "^1.36.22", optional = true }
google-api-python-client = { version = "^2.163.0", optional = true }
google-auth-httplib2 = { version = "^0.2.0", optional = true }
google-auth-oauthlib = { version = "^1.2.1", optional = true }
stripe-agent-toolkit = { version = "^0.6.1", optional = true }
langchain-salesforce = { version = "^0.1.2", optional = true }
python-steam-api = { version = "^2.1.1", optional = true }
python-decouple = { version = "^3.8", optional = true }

# Translation services (optional)
googletrans = { version = "^4.0.2", optional = true }
deepl = { version = "^1.21.1", optional = true }

# Code parsing (optional)
esprima = { version = "^4.0.1", optional = true }
tree-sitter = { version = "^0.24.0", optional = true }
tree-sitter-languages = { version = "^1.10.2", optional = true }

# Memory and analytics (optional)
zep-python = { version = "^2.0.2", optional = true }
prometheus-client = { version = "^0.21.1", optional = true }

# UI frameworks (optional)
gradio = { version = "^5.23.1", optional = true }

# Game specific (optional)
chess = { version = "^1.11.1", optional = true }

# Testing and development (optional)
pytest = { version = "^8.3.5", optional = true }
rich = { version = "^13.9.4", optional = true }

# MCP support (optional)
mcp = { version = "^1.9.4", optional = true }
langchain-mcp-adapters = { version = "^0.1.7", optional = true }
langmem = "^0.0.27"
langgraph-supervisor = "^0.0.27"


