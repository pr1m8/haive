[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts"]
skips = ["B101", "B311"]

[tool.poetry.extras]
cpu = ["torch-cpu", "torchvision-cpu", "torchaudio-cpu"]
cuda = ["torch-cuda", "torchvision-cuda", "torchaudio-cuda"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe complexity
  "I",   # isort
  "N",   # pep8-naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  "ISC", # flake8-implicit-str-concat
  "G",   # flake8-logging-format
  "PIE", # flake8-pie
  "T20", # flake8-print
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
  "ERA", # eradicate commented-out code
  "PL",  # pylint
  "TRY", # tryceratops
  "RUF", # ruff-specific rules
]
ignore = [
  "E501",   # line too long
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "RET504", # Unnecessary variable assignment before return
  "TRY003", # Long messages outside exception class
]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
  "D",       # No docstring requirements in tests
  "S101",    # Allow assert in tests
  "PLR2004", # Allow magic numbers in tests
]
"examples/**/*.py" = [
  "D",   # Relaxed docstring requirements in examples
  "T20", # Allow print in examples
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.mccabe]
max-complexity = 12

[tool.ruff.isort]
known-first-party = [
  "haive_core",
  "haive_agents",
  "haive_games",
  "haive_prebuilt",
  "haive_tools",
]


