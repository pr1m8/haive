  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
repository = "https://github.com/prim8/haive"
homepage = "https://haive.readthedocs.io"
documentation = "https://haive.readthedocs.io"
keywords = ["ai", "agents", "llm", "language models", "langgraph"]
packages = [{include = "haive", from = "src"}]
# Scripts 
[tool.poetry.scripts]
haive = "haive.cli:main"


# CUDA TORCH 
