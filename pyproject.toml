[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts"]
skips = ["B101", "B311"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false, disallow_incomplete_defs = false },
]

[tool.doc8]
max-line-length = 100
ignore-path = ["docs/build", "*.egg-info", "**/__pycache__", ".git"]
file-encoding = "utf-8"
ignore = ["D001", "D002", "D004"]                                    # Ignore some line length warnings

[tool.codespell]
skip = "*.json,*.csv,poetry.lock,.git,*.pyc,*.pyo,*.egg-info,docs/build"
ignore-words-list = "haive,agentic,nd,te,ot,od,ue"
count = true
quiet-level = 2


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Core linting, formatting, complexity, and docstring checks
select = [
  "E",
  "F",
  "W",      # pycodestyle (E/W) and pyflakes (F)
  "B",      # bugbear
  "C90",
  "C4",     # flake8-comprehensions
  "DTZ",
  "T10",
  "T20",    # blanket-flake-8 plug-in codes
  "G",
  "I",
  "N",      # naming, imports, unused-names
  "PIE",
  "ARG",
  "ERA",    # productivity rules
  "RET",
  "RSE",
  "SIM",    # return, refactor, simplify
  "PL",
  "TRY",
  "RUF",    # pylintrc and Ruff-specific
  "UP",     # pyupgrade
  "Q",      # qcodes
  "TID251",
  "TID252", # enforce absolute imports
]
ignore = [
  "E501",   # let ruff format handle long lines
  "D100",   # allow missing __init__ doc
  "D104",   # allow missing package doc
  "D107",   # allow missing __str__/__repr__ doc
  "D203",   # no blank line after one-line summary (Google style)
  "D213",   # no blank before closing quotes
  "RET504", # optional semantics rules
  "TRY003", # optional try-except style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLR2004"]
"examples/**/*.py" = ["D", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 12


[tool.ruff.lint.isort]
known-first-party = ["haive"]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.yamlfix]
exclude = ["**/.venv/**"]

# =============================
# 📚 Google-Style Docstring Enforcement
# =============================
[tool.pydocstyle]
# Strict Google conventions
convention = "google"
match = "(?!test_).*\\.py"
add-ignore = ["D100", "D203"] # align with Ruff ignores


[tool.docformatter]
style = "google"
in-place = true

[tool.darglint2]
# Use Google style conventions and enforce on public functions only
strictness = 2        # 0 = lenient, 1 = moderate, 2 = strict, 3 = very strict
ignore_regex = "^_.*" # Skip private/internal functions starting with underscore


# 📦 AutoImport Configuration for Namespaced Poly Repo
[tool.autoimport]
# Disable moving to top to preserve existing structure
disable_move_to_top = false

# Force absolute imports for haive namespace
force_absolute_imports = true

# Exclude certain directories from auto-import processing
exclude_dirs = [
  "docs",
  "tests/fixtures",
  "build",
  ".git",
  "__pycache__",
  ".trunk",
  ".cache",
]

# Common statements for haive namespace
[tool.autoimport.common_statements]
# Core haive imports
"haive.core" = "from haive import core"
"haive.agents" = "from haive import agents"
"haive.tools" = "from haive import tools"
"haive.games" = "from haive import games"
"haive.dataflow" = "from haive import dataflow"
"haive.mcp" = "from haive import mcp"

# Common Python patterns
"np" = "import numpy as np"
"pd" = "import pandas as pd"
"plt" = "import matplotlib.pyplot as plt"
"Path" = "from pathlib import Path"
"Optional" = "from typing import Optional"
"Union" = "from typing import Union"
"List" = "from typing import List"
"Dict" = "from typing import Dict"
"Any" = "from typing import Any"

# LangChain common imports
"BaseModel" = "from pydantic import BaseModel"
"Field" = "from pydantic import Field"

# 🔧 Import Organization Rules
[tool.autoimport.import_rules]
# Always use absolute imports for haive namespace
prefer_absolute = ["haive.*"]

# Detect and flag relative imports as errors
flag_relative_imports = true

# Auto-fix common import issues
auto_fix_imports = true

[tool.trailrunner]
# Instruct Trailrunner to skip any .cache/trunk or .trunk directories
exclude = ["**/.cache/trunk/**", "**/.trunk/**"]


# 🚀 Taskipy Development Workflow Tasks
[tool.taskipy.tasks]

# 🦥 Lazy Loading Management Tasks (with Universal Dry-Run Wrapper)
lazy-loading-dry = "DRY_RUN=1 python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --auto --full-safety"
lazy-loading-test = "python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --auto --test-only"
lazy-loading-deploy = "python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --auto --full-safety"
lazy-loading-models = "python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --files packages/haive-core/src/haive/core/models/__init__.py --full-safety"
lazy-loading-tools = "python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --files packages/haive-core/src/haive/core/tools/__init__.py --full-safety"
lazy-loading-agents = "python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/safe_lazy_loading_deployment.py --files packages/haive-agents/src/haive/agents/__init__.py --full-safety"
lazy-loading-rollback = "python scripts/maintenance/safe_lazy_loading_deployment.py --list-backups"
lazy-loading-preview = "DRY_RUN=1 python scripts/maintenance/dryrun_wrapper.py -- python scripts/maintenance/generalized_lazy_loading.py --auto --preview"

# 🔧 Import Fixing Tasks (Smart Wrapper - Works with any package)
fix-imports-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py -- poetry run absolufy-imports packages/"
fix-imports = "python scripts/smart_dryrun_wrapper.py -- poetry run absolufy-imports packages/"

# 🎯 Per-package import fixing (UNIVERSAL - Works with any target!)
# Using --target argument for maximum flexibility (supports any path/package/directory)
fix-imports-core-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-core -- poetry run absolufy-imports"
fix-imports-core = "python scripts/smart_dryrun_wrapper.py --target haive-core -- poetry run absolufy-imports"
fix-imports-agents-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-agents -- poetry run absolufy-imports"
fix-imports-agents = "python scripts/smart_dryrun_wrapper.py --target haive-agents -- poetry run absolufy-imports"
fix-imports-tools-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-tools -- poetry run absolufy-imports"
fix-imports-tools = "python scripts/smart_dryrun_wrapper.py --target haive-tools -- poetry run absolufy-imports"
fix-imports-games-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-games -- poetry run absolufy-imports"
fix-imports-games = "python scripts/smart_dryrun_wrapper.py --target haive-games -- poetry run absolufy-imports"
fix-imports-dataflow-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-dataflow -- poetry run absolufy-imports"
fix-imports-dataflow = "python scripts/smart_dryrun_wrapper.py --target haive-dataflow -- poetry run absolufy-imports"
fix-imports-mcp-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-mcp -- poetry run absolufy-imports"
fix-imports-mcp = "python scripts/smart_dryrun_wrapper.py --target haive-mcp -- poetry run absolufy-imports"
fix-imports-prebuilt-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py --target haive-prebuilt -- poetry run absolufy-imports"
fix-imports-prebuilt = "python scripts/smart_dryrun_wrapper.py --target haive-prebuilt -- poetry run absolufy-imports"

# 🧹 Code Quality Tasks (Smart Wrapper - Automatically Adds --check/--diff)  
format-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py -- poetry run ruff format packages/"
format = "python scripts/smart_dryrun_wrapper.py -- poetry run ruff format packages/"
lint-fix-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py -- poetry run ruff check --fix packages/"
lint-fix = "python scripts/smart_dryrun_wrapper.py -- poetry run ruff check --fix packages/"

# 📦 Package Management (Smart Wrapper - Automatically Adds --dry-run)
add-package-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py -- poetry add"
add-package = "python scripts/smart_dryrun_wrapper.py -- poetry add"
remove-package-dry = "DRY_RUN=1 python scripts/smart_dryrun_wrapper.py -- poetry remove"
remove-package = "python scripts/smart_dryrun_wrapper.py -- poetry remove"

# 🤖 Interactive Versions (Ask before executing)  
fix-imports-dataflow-interactive = "INTERACTIVE=1 python scripts/smart_dryrun_wrapper.py --target haive-dataflow -- poetry run absolufy-imports"
format-interactive = "INTERACTIVE=1 python scripts/smart_dryrun_wrapper.py -- poetry run ruff format packages/"
add-package-interactive = "INTERACTIVE=1 python scripts/smart_dryrun_wrapper.py -- poetry add"

# 🧠 Intelligent Error Analysis & Categorization
analyze-errors = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --analyze-only"
analyze-errors-verbose = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --analyze-only --verbose"
analyze-all = "dev-tools/scripts/intelligent-error-analyzer.sh packages/ --analyze-only"

# 🚨 Safety-Level Fixes (Progressive Approach)
emergency-fix = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --fix --safety-level 1"
surgical-fix = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --fix --safety-level 2"
moderate-fix = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --fix --safety-level 3"
conservative-fix = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --fix --safety-level 4"
cosmetic-fix = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --fix --safety-level 5"

# 👁️ Preview Modes (See Changes Before Applying)
preview-emergency = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --preview --safety-level 1"
preview-surgical = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --preview --safety-level 2"
preview-moderate = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --preview --safety-level 3"
preview-full = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --preview --safety-level 5"

# 📊 Error Analysis Reports
error-report = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --analyze-only --report markdown"
error-report-json = "dev-tools/scripts/intelligent-error-analyzer.sh packages/haive-prebuilt/src --analyze-only --report json"

# 🔄 Systematic Code Fixing (Master Workflows)
fix-code = "dev-tools/scripts/systematic-code-fixer.sh packages/haive-prebuilt/src"
fix-code-preview = "dev-tools/scripts/systematic-code-fixer.sh packages/haive-prebuilt/src --preview"

# 🚨 Pre-flight Syntax Fixes
fix-syntax = "dev-tools/scripts/pre-flight-syntax-fixer.sh packages/haive-prebuilt/src"
fix-syntax-preview = "dev-tools/scripts/pre-flight-syntax-fixer.sh packages/haive-prebuilt/src --preview"

# 🔧 Modern Indentation Tools
fix-indentation = "dev-tools/scripts/modern-indentation-fixer.sh packages/haive-prebuilt/src autopep8"
fix-indentation-preview = "dev-tools/scripts/modern-indentation-fixer.sh packages/haive-prebuilt/src autopep8 --preview"

# 📦 Import Management (3-Way System) - LEGACY (replaced by smart wrapper above)
# fix-imports = "dev-tools/scripts/comprehensive-import-manager.sh packages/haive-prebuilt/src"
# fix-imports-preview = "dev-tools/scripts/comprehensive-import-manager.sh packages/haive-prebuilt/src --preview"

# 🐍 Python Modernization
modernize-code = "dev-tools/scripts/syntax-and-modernization-fixer.sh packages/haive-prebuilt/src"
modernize-code-preview = "dev-tools/scripts/syntax-and-modernization-fixer.sh packages/haive-prebuilt/src --preview"

# 🔄 Configuration Management
fix-rich-dependency = "dev-tools/scripts/fix-rich-dependency-permanently.sh"
validate-rich = "dev-tools/scripts/validate-rich-dependency.sh"
restore-taskipy = "dev-tools/scripts/restore-taskipy-config.sh"

# 🔍 Debugging and Analysis
debug-syntax = "dev-tools/scripts/debug-and-fix-syntax.sh packages/haive-prebuilt/src"
debug-syntax-fix = "dev-tools/scripts/debug-and-fix-syntax.sh packages/haive-prebuilt/src --fix"

# 🧹 Cleanup and Maintenance
clean-backups = "find packages/ -name '*.py.bak' -delete && find packages/ -name '*~' -delete"
clean-cache = "find packages/ -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true"
clean-all = "poetry run task clean-backups && poetry run task clean-cache"

# 🚀 Quick Start Workflows
quick-fix = "poetry run task emergency-fix && poetry run task surgical-fix"
full-fix = "poetry run task fix-code"
health-check = "find packages/haive-prebuilt/src -name '*.py' -exec python3 -m py_compile {} \\; 2>&1 | grep -c 'SyntaxError\\|IndentationError' || echo '✅ All files compile successfully'"

# 📚 Documentation and Help
help-tasks = "echo '🧠 Available tasks:' && poetry run task --list"
help-scripts = "echo '📁 Script documentation in dev-tools/README.md'"

# 📰 Changelog Management
changelog-preview = "poetry run towncrier build --draft"
changelog-build = "poetry run towncrier build"
changelog-check = "poetry run towncrier check"
changelog-create = "echo '📝 Create changelog fragment in changes/{type}/{issue}.{description}.md'"

# 🔧 Pre-commit Management
precommit-install = "poetry run pre-commit install"
precommit-run = "poetry run pre-commit run --all-files"
precommit-update = "poetry run pre-commit autoupdate"
precommit-clean = "poetry run pre-commit clean"
precommit-check = "poetry run pre-commit run --all-files --show-diff-on-failure"

# ===================================================================
# 📰 Towncrier Configuration - Changelog Management
# ===================================================================

[tool.towncrier]
package = "haive"
filename = "CHANGELOG.md"
directory = "changes"
title_format = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n<!-- towncrier release notes start -->"
issue_format = "[#{issue}](https://github.com/prim8/haive/issues/{issue})"
# template = "changes/.template.md"  # Using default template
start_string = "<!-- towncrier release notes start -->"
underlines = ["", "", ""]
all_bullets = false
# Ignore directories and common non-fragment files
ignore = [
  "README.md",
  ".template.md",
  ".gitkeep",
  "feature",
  "bugfix",
  "improvement",
  "deprecation",
  "breaking",
  "security",
  "performance",
  "docs",
  "dev",
  "misc",
]

[[tool.towncrier.type]]
directory = "feature"
name = "🚀 Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "🐛 Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "✨ Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "🗑️ Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "💥 Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "🔒 Security"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "⚡ Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "📚 Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dev"
name = "🔧 Development"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "🔀 Miscellaneous"
showcontent = true

