name: "📊 Coverage"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/resources/**'  # Ignore resources folders
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/resources/**'  # Ignore resources folders

jobs:
  coverage:
    name: "Coverage for ${{ matrix.package }} on ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          # Use sparse checkout to exclude resources folders
          sparse-checkout: |
            .github
            packages/${{ matrix.package }}
          sparse-checkout-cone-mode: false

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-info

      - name: 🐍 Set up Python ${{ steps.poetry.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}

      - name: 🛠 Install Poetry
        run: pipx install poetry==${{ steps.poetry.outputs.poetry_version }}

      - name: 📚 Install dependencies and pytest-cov
        run: |
          cd packages/${{ matrix.package }}
          poetry install
          poetry run pip install pytest-cov

      - name: 🧪 Run tests with coverage
        run: |
          echo "🔍 Running coverage for: ${{ matrix.package }}"
          cd packages/${{ matrix.package }}
          poetry run pytest --cov=src --cov-report=xml --ignore=src/**/resources

      - name: ☁️ Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage.xml