name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]

    steps:
      - uses: actions/checkout@v4

      - name: Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}

      - name: Install Poetry
        run: pipx install poetry==1.8.0

      - name: Install dependencies and pytest-cov
        run: |
          cd packages/${{ matrix.package }}
          poetry install
          poetry run pip install pytest-cov

      - name: Run tests with coverage
        run: |
          cd packages/${{ matrix.package }}
          poetry run pytest --cov=src --cov-report=xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/${{ matrix.package }}/coverage.xml
