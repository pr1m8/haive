name: Trunk Code Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          arguments: check --all
