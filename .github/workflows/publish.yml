name: 🚀 Publish Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: 📦 Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package:
          - haive-core
          - haive-agents
          - haive-games
          - haive-tools
          - haive-prebuilt
          - haive-dataflow

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 📦 Create Package Structure
        run: |
          # Ensure package directory exists with correct structure
          mkdir -p "packages/${{ matrix.package }}/src/haive/${matrix.package#haive-}"
          mkdir -p "packages/${{ matrix.package }}/src/haive"
          
          # Create necessary __init__.py files
          touch "packages/${{ matrix.package }}/src/haive/__init__.py"
          touch "packages/${{ matrix.package }}/src/haive/${matrix.package#haive-}/__init__.py"
          
          # Create minimal package file if it doesn't exist
          PKG_INIT="packages/${{ matrix.package }}/src/haive/${matrix.package#haive-}/__init__.py"
          if [ ! -f "$PKG_INIT" ] || [ ! -s "$PKG_INIT" ]; then
            echo "Creating minimal __init__.py file"
            cat > "$PKG_INIT" << EOF
"""${{ matrix.package }} package."""

__version__ = "0.1.0"
EOF
          fi
          
          # Create minimal pyproject.toml if it doesn't exist
          if [ ! -f "packages/${{ matrix.package }}/pyproject.toml" ]; then
            cat > "packages/${{ matrix.package }}/pyproject.toml" << EOF
[tool.poetry]
name = "${{ matrix.package }}"
version = "0.1.0"
description = "Package for ${{ matrix.package }}"
packages = [
    { include = "haive", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
EOF
          fi

      - name: 📦 Get Package Poetry Info
        id: poetry
        uses: ./.github/actions/get-package-poetry-info
        with:
          package: ${{ matrix.package }}

      - name: 🧾 Echo Package Metadata
        run: |
          echo "📦 Name:        ${{ steps.poetry.outputs.name }}"
          echo "🔖 Version:     ${{ steps.poetry.outputs.version }}"
          echo "🧑 Authors:     ${{ steps.poetry.outputs.authors || 'N/A' }}"
          echo "📄 License:     ${{ steps.poetry.outputs.license || 'N/A' }}"
          echo "📝 Description: ${{ steps.poetry.outputs.description || 'N/A' }}"
          echo "🌐 Homepage:    ${{ steps.poetry.outputs.homepage || 'N/A' }}"
          echo "🔗 Repository:  ${{ steps.poetry.outputs.repository || 'N/A' }}"
          echo "📚 Docs:        ${{ steps.poetry.outputs.documentation || 'N/A' }}"
          echo "🏷 Classifiers: ${{ steps.poetry.outputs.classifiers || 'N/A' }}"

      - name: 🐍 Set up Python ${{ steps.poetry.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}
          cache: poetry

      - name: 🛠 Install Poetry
        run: pipx install poetry==1.8.0

      - name: 🔐 Configure PyPI Credentials
        run: poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}

      - name: 📦 Build Package (No Publish)
        run: |
          cd packages/${{ matrix.package }}
          poetry build --format wheel
          
      - name: 📤 Upload Package as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.package }}-dist
          path: packages/${{ matrix.package }}/dist/