name: "🧪 Test"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/resources/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/resources/**'

jobs:
  lint:
    name: "🧹 Pre-commit Lint"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🐍 Get Python Version
        id: python-version
        uses: ./.github/actions/get-python-version

      - name: 🐍 Set up Python ${{ steps.python-version.outputs.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: 📦 Install Pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: ✅ Run Pre-commit
        run: pre-commit run --all-files

  test-packages:
    name: "🧪 Test ${{ matrix.package }}"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
      fail-fast: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Get Poetry Metadata
        id: poetry-metadata
        uses: ./.github/actions/get-poetry-metadata

      - name: 🐍 Set up Python ${{ steps.poetry-metadata.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry-metadata.outputs.python }}

      - name: 🛠 Install Poetry
        run: pipx install poetry==${{ steps.poetry-metadata.outputs.poetry_version }}

      - name: 🔄 Set Working Directory
        id: set-dir
        run: |
          if [ -d "packages/${{ matrix.package }}" ]; then
            echo "package_dir=packages/${{ matrix.package }}" >> $GITHUB_OUTPUT
            echo "Found package directory: packages/${{ matrix.package }}"
          else
            echo "⚠️ Package directory not found: packages/${{ matrix.package }}"
            exit 1
          fi

      - name: 🌱 Install Dependencies
        run: |
          cd ${{ steps.set-dir.outputs.package_dir }}
          echo "Installing dependencies for ${{ matrix.package }}..."
          poetry install --no-interaction

      - name: ✅ Run Tests
        run: |
          cd ${{ steps.set-dir.outputs.package_dir }}
          echo "Running tests for ${{ matrix.package }}..."
          poetry run pytest -xvs

  type-check:
    name: "🔎 Type Check ${{ matrix.package }}"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
      fail-fast: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Get Poetry Metadata
        id: poetry-metadata
        uses: ./.github/actions/get-poetry-metadata

      - name: 🐍 Set up Python ${{ steps.poetry-metadata.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry-metadata.outputs.python }}

      - name: 🛠 Install Poetry
        run: pipx install poetry==${{ steps.poetry-metadata.outputs.poetry_version }}

      - name: 🔄 Set Working Directory
        id: set-dir
        run: |
          if [ -d "packages/${{ matrix.package }}" ]; then
            echo "package_dir=packages/${{ matrix.package }}" >> $GITHUB_OUTPUT
            echo "Found package directory: packages/${{ matrix.package }}"
          else
            echo "⚠️ Package directory not found: packages/${{ matrix.package }}"
            exit 1
          fi

      - name: 🌱 Install Dependencies & Mypy
        run: |
          cd ${{ steps.set-dir.outputs.package_dir }}
          echo "Installing dependencies for ${{ matrix.package }}..."
          poetry install --no-interaction
          poetry run pip install mypy

      - name: 🔍 Run Mypy
        run: |
          cd ${{ steps.set-dir.outputs.package_dir }}
          echo "Type checking ${{ matrix.package }}..."
          if [ -d "src" ]; then
            poetry run mypy src --ignore-missing-imports
          fi
          if [ -d "tests" ]; then
            poetry run mypy tests --ignore-missing-imports
          fi