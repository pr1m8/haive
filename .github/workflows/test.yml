name: "🧪 Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "🧹 Pre-commit Lint"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: ✅ Run Pre-commit
        run: pre-commit run --all-files

  test-packages:
    name: "🧪 Test ${{ matrix.package }} (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
        python-version: ['3.12', '3.13']

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-info

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version || steps.poetry.outputs.python }}

      - name: 🔧 Install Poetry
        run: pipx install poetry==${{ steps.poetry.outputs.poetry_version }}

      - name: ✅ Run Pytest for ${{ matrix.package }}
        run: |
          echo "Running tests for: ${{ matrix.package }} on Python ${{ matrix.python-version }}"
          cd packages/${{ matrix.package }}
          poetry install
          poetry run pytest

  type-check:
    name: "🔎 Type Check ${{ matrix.package }} (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
        python-version: ['3.12', '3.13']

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-info

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version || steps.poetry.outputs.python }}

      - name: 🔧 Install Mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: ✅ Run Mypy on ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          mypy src tests