name: "🧪 Test"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/resources/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/resources/**'

jobs:
  lint:
    name: "🧹 Pre-commit Lint"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-metadata

      - name: 🐍 Set up Python ${{ steps.poetry.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}

      - name: 📦 Install Pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: ✅ Run Pre-commit
        run: pre-commit run --all-files

  test-packages:
    name: "🧪 Test ${{ matrix.package }}"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
      fail-fast: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-metadata
        with:
          package: ${{ matrix.package }}

      - name: 🐍 Set up Python ${{ steps.poetry.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}

      - name: 🛠 Install Poetry
        run: pipx install poetry==${{ steps.poetry.outputs.poetry_version }}

      - name: 🔄 Verify Package
        id: verify
        run: |
          if [ ! -d "packages/${{ matrix.package }}" ]; then
            echo "⚠️ Package directory not found: packages/${{ matrix.package }}"
            exit 1
          fi
          
          if [ ! -f "packages/${{ matrix.package }}/pyproject.toml" ]; then
            echo "⚠️ pyproject.toml not found in packages/${{ matrix.package }}"
            exit 1
          fi
          
          echo "Package verified: ${{ matrix.package }}"

      - name: 🌱 Install Dependencies
        run: |
          cd packages/${{ matrix.package }}
          poetry install --no-interaction

      - name: ✅ Run Tests
        run: |
          cd packages/${{ matrix.package }}
          if [ -d "tests" ] || [ -d "src/haive/*/tests" ]; then
            poetry run pytest -xvs
          else
            echo "No tests found for ${{ matrix.package }}, skipping"
          fi

  type-check:
    name: "🔎 Type Check ${{ matrix.package }}"
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_DEBUG || 'false' }}
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
      fail-fast: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📦 Get Poetry Metadata
        id: poetry
        uses: ./.github/actions/get-poetry-metadata
        with:
          package: ${{ matrix.package }}

      - name: 🐍 Set up Python ${{ steps.poetry.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.poetry.outputs.python }}

      - name: 🛠 Install Poetry
        run: pipx install poetry==${{ steps.poetry.outputs.poetry_version }}

      - name: 🔄 Verify Package
        id: verify
        run: |
          if [ ! -d "packages/${{ matrix.package }}" ]; then
            echo "⚠️ Package directory not found: packages/${{ matrix.package }}"
            exit 1
          fi
          
          if [ ! -f "packages/${{ matrix.package }}/pyproject.toml" ]; then
            echo "⚠️ pyproject.toml not found in packages/${{ matrix.package }}"
            exit 1
          fi
          
          echo "Package verified: ${{ matrix.package }}"

      - name: 🌱 Install Dependencies & Mypy
        run: |
          cd packages/${{ matrix.package }}
          poetry install --no-interaction
          poetry run pip install mypy

      - name: 🔍 Run Mypy
        run: |
          cd packages/${{ matrix.package }}
          if [ -d "src" ]; then
            poetry run mypy src --ignore-missing-imports
          fi
          if [ -d "tests" ]; then
            poetry run mypy tests --ignore-missing-imports
          fi