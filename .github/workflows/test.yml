name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Update to latest checkout version
      - name: Set up Python
        uses: actions/setup-python@v5  # Update to latest setup-python
        with:
          python-version: '>=3.12'  # Minimum Python version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  test-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
        python-version: ['3.12', '3.13']  # Test specific versions
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
      - name: Test package
        run: |
          cd packages/${{ matrix.package }}
          poetry install
          poetry run pytest

  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [haive-core, haive-agents, haive-games, haive-dataflow, haive-tools, haive-prebuilt]
        python-version: ['3.12', '3.13']  # Add version matrix
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Run mypy
        run: |
          cd packages/${{ matrix.package }}
          mypy src tests
