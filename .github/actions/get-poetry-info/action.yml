name: "Get Poetry Metadata"
description: "Parses key metadata from pyproject.toml"
outputs:
  name:
    description: "Package name"
    value: ${{ steps.extract.outputs.name }}
  version:
    description: "Package version"
    value: ${{ steps.extract.outputs.version }}
  python:
    description: "Python version requirement"
    value: ${{ steps.extract.outputs.python }}
  poetry_version:
    description: "Poetry version requirement"
    value: ${{ steps.extract.outputs.poetry_version }}
  authors:
    description: "Author(s) listed"
    value: ${{ steps.extract.outputs.authors }}
  license:
    description: "License string"
    value: ${{ steps.extract.outputs.license }}
  description:
    description: "Package description"
    value: ${{ steps.extract.outputs.description }}
  homepage:
    description: "Homepage URL"
    value: ${{ steps.extract.outputs.homepage }}
  repository:
    description: "Source repository"
    value: ${{ steps.extract.outputs.repository }}
  documentation:
    description: "Documentation URL"
    value: ${{ steps.extract.outputs.documentation }}
  classifiers:
    description: "Classifiers list"
    value: ${{ steps.extract.outputs.classifiers }}
runs:
  using: "composite"
  steps:
    - id: extract
      run: |
        python <<EOF > poetry-info.env
        import tomllib
        import re
        import subprocess
        import sys

        data = tomllib.load(open("pyproject.toml", "rb"))

        # Get Poetry data
        poetry_data = data["tool"]["poetry"]
        deps = poetry_data["dependencies"]

        # Try to extract Poetry version from build-system
        try:
            build_system = data.get("build-system", {})
            requires = build_system.get("requires", [])
            poetry_version = "1.8.0"  # Default fallback
            
            for req in requires:
                if req.startswith("poetry"):
                    match = re.search(r"poetry(>=|==|~=)?([\d\.]+)", req)
                    if match:
                        poetry_version = match.group(2)
                        break
        except Exception:
            poetry_version = "1.8.0"  # Default fallback

        def get(key, default=""):
            return poetry_data.get(key, default)

        def extract_list(key):
            return "|".join(poetry_data.get(key, []))

        # Normalize python version
        constraint = deps.get("python", "")
        match = re.search(r"(\d+\.\d+)", constraint)
        python_version = match.group(1) if match else "3.12"

        print(f"name={get('name')}")
        print(f"version={get('version')}")
        print(f"python={python_version}")
        print(f"poetry_version={poetry_version}")
        print(f"authors={extract_list('authors')}")
        print(f"license={get('license', 'unspecified')}")
        print(f"description={get('description')}")
        print(f"homepage={get('homepage')}")
        print(f"repository={get('repository')}")
        print(f"documentation={get('documentation')}")
        print(f"classifiers={'⏎'.join(poetry_data.get('classifiers', []))}")
        EOF

        while read line; do
          echo "$line" >> $GITHUB_ENV
          key=$(echo "$line" | cut -d= -f1)
          val=$(echo "$line" | cut -d= -f2-)
          echo "$key=$val" >> "$GITHUB_OUTPUT"
        done < poetry-info.env
      shell: bash