name: "Get Package Poetry Info"
description: "Extracts Poetry information from a specific package"
inputs:
  package:
    description: "Package name to analyze (relative to packages/)"
    required: true
outputs:
  name:
    description: "Package name"
    value: ${{ steps.extract.outputs.name }}
  version:
    description: "Package version"
    value: ${{ steps.extract.outputs.version }}
  python:
    description: "Python version requirement"
    value: ${{ steps.extract.outputs.python }}
  poetry_version:
    description: "Poetry version requirement"
    value: ${{ steps.extract.outputs.poetry_version }}
runs:
  using: "composite"
  steps:
    - id: extract
      shell: bash
      run: |
        PACKAGE_DIR="packages/${{ inputs.package }}"
        PYPROJECT_PATH="${PACKAGE_DIR}/pyproject.toml"
        
        # Check if package directory and pyproject.toml exist
        if [ ! -d "$PACKAGE_DIR" ]; then
          echo "::error::Package directory '$PACKAGE_DIR' not found"
          exit 1
        fi
        
        if [ ! -f "$PYPROJECT_PATH" ]; then
          echo "::error::pyproject.toml not found at '$PYPROJECT_PATH'"
          exit 1
        fi
        
        echo "Extracting Poetry info from: $PYPROJECT_PATH"
        
        python - <<EOF > package-poetry-info.env
        import tomllib
        import re
        import sys
        
        try:
            with open("$PYPROJECT_PATH", "rb") as f:
                data = tomllib.load(f)
        except FileNotFoundError:
            print("::error::Could not open pyproject.toml")
            sys.exit(1)
            
        # Get Poetry data
        try:
            poetry_data = data["tool"]["poetry"]
            deps = poetry_data["dependencies"]
        except KeyError:
            print("::error::Invalid pyproject.toml format")
            sys.exit(1)
        
        # Try to extract Poetry version from build-system
        try:
            build_system = data.get("build-system", {})
            requires = build_system.get("requires", [])
            poetry_version = "1.8.0"  # Default fallback
            
            for req in requires:
                if req.startswith("poetry"):
                    match = re.search(r"poetry(>=|==|~=)?([\d\.]+)", req)
                    if match:
                        poetry_version = match.group(2)
                        break
        except Exception:
            poetry_version = "1.8.0"  # Default fallback
        
        # Normalize python version
        constraint = deps.get("python", "")
        # Handle different version specifiers: ^3.12, >=3.12,<3.13, etc.
        match = re.search(r"(\d+\.\d+)", constraint)
        python_version = match.group(1) if match else "3.12"
        
        print(f"name={poetry_data.get('name', '${{ inputs.package }}')}")
        print(f"version={poetry_data.get('version', '0.1.0')}")
        print(f"python={python_version}")
        print(f"poetry_version={poetry_version}")
        EOF
        
        while read line; do
          echo "$line" >> $GITHUB_ENV
          key=$(echo "$line" | cut -d= -f1)
          val=$(echo "$line" | cut -d= -f2-)
          echo "$key=$val" >> "$GITHUB_OUTPUT"
        done < package-poetry-info.env