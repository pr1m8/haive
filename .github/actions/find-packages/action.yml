name: "Find Packages"
description: "Discovers all package directories in the repository"
outputs:
  packages:
    description: "JSON array of package names"
    value: ${{ steps.find.outputs.packages }}
  package_count:
    description: "Number of packages found"
    value: ${{ steps.find.outputs.package_count }}
runs:
  using: "composite"
  steps:
    - id: find
      shell: bash
      run: |
        echo "Finding packages in packages/ directory..."
        
        # Create packages directory if it doesn't exist
        if [ ! -d "packages" ]; then
          mkdir -p packages
          echo "Created packages directory"
        fi
        
        # Check for existing directories in packages/
        PACKAGES=()
        
        for pkg_dir in packages/*/; do
          if [ -d "$pkg_dir" ]; then
            pkg_name=$(basename "$pkg_dir")
            
            # Create minimal pyproject.toml if it doesn't exist
            if [ ! -f "${pkg_dir}pyproject.toml" ]; then
              mkdir -p "${pkg_dir}src/haive/${pkg_name/haive-/}/"
              cat > "${pkg_dir}pyproject.toml" << EOF
[tool.poetry]
name = "${pkg_name}"
version = "0.1.0"
description = "Generated package for ${pkg_name}"

[tool.poetry.dependencies]
python = "^3.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
EOF
              echo "Created minimal pyproject.toml for $pkg_name"
            fi
            
            PACKAGES+=("$pkg_name")
          fi
        done
        
        # If no packages found, create a default haive-core package
        if [ ${#PACKAGES[@]} -eq 0 ]; then
          echo "No packages found, creating default haive-core package"
          mkdir -p packages/haive-core/src/haive/core
          cat > packages/haive-core/pyproject.toml << EOF
[tool.poetry]
name = "haive-core"
version = "0.1.0"
description = "Default core package"

[tool.poetry.dependencies]
python = "^3.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
EOF
          PACKAGES+=("haive-core")
        fi
        
        # Convert bash array to JSON array for GitHub Actions
        JSON_PACKAGES="["
        for pkg in "${PACKAGES[@]}"; do
          JSON_PACKAGES="${JSON_PACKAGES}\"${pkg}\","
        done
        JSON_PACKAGES="${JSON_PACKAGES%,}]"  # Remove trailing comma and close array
        
        echo "packages=${JSON_PACKAGES}" >> $GITHUB_OUTPUT
        echo "package_count=${#PACKAGES[@]}" >> $GITHUB_OUTPUT
        
        echo "Found ${#PACKAGES[@]} packages: ${PACKAGES[*]}"
        echo "JSON packages: ${JSON_PACKAGES}"