name: Daily LLM Data Update

on:
  schedule:
    # Run once a day at midnight UTC
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-llm-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'  # Adjust to your project's Python version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.5.1  # Specify the Poetry version you wish to use

      - name: Install dependencies
        run: poetry install

      - name: Run update script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: poetry run python update_scheduler.py

      - name: Commit changes to hash file if any
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/litellm_hash.txt
          git add data/litellm_last.json
          git diff --staged --quiet || git commit -m "Update LiteLLM data hash [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
