[tox]
envlist = py312, lint, typecheck, integration
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    -r requirements.txt
commands =
    pytest tests/unit

[testenv:lint]
description = Run pre-commit hooks (lint, format, etc.)
skip_install = true
deps = pre-commit
commands =
    pre-commit run --all-files

[testenv:typecheck]
description = Run static type checks with mypy
deps = mypy
commands =
    mypy src/ tests/

[testenv:docker-up]
description = Spin up docker-compose services
skip_install = true
allowlist_externals = docker-compose
commands =
    docker-compose -f docker/docker-compose.yaml up -d --build

[testenv:docker-down]
description = Tear down docker-compose services
skip_install = true
allowlist_externals = docker-compose
commands =
    docker-compose -f docker/docker-compose.yaml down -v

[testenv:integration]
description = Run integration tests (requires docker-compose)
deps = pytest
commands_pre =
    tox -e docker-up
commands =
    pytest tests/integration
commands_post =
    tox -e docker-down
