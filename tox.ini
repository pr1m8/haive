[tox]
envlist = py312, lint, format, hooks, trunk

[testenv]
description = Run pytest using config from pytest.ini
deps = 
    pytest
commands = 
    pytest

[testenv:lint]
description = Run ruff linter
deps = 
    ruff
commands = 
    ruff src/ tests/

[testenv:format]
description = Check formatting with black
deps = 
    black
commands = 
    black --check src/ tests/

[testenv:hooks]
description = Run pre-commit hooks
deps = 
    pre-commit
commands = 
    pre-commit run --all-files

[testenv:trunk]
description = Run Trunk check
skip_install = true
allowlist_externals = trunk
commands = 
    trunk check
