[pytest]
minversion = 6.0

# Point to all the package source directories
pythonpath =
    packages/haive-core/src
    packages/haive-agents/src
    packages/haive-tools/src
    packages/haive-games/src
    packages/haive-prebuilt/src
    packages/haive-dataflow/src

# Test discovery locations
testpaths =
    packages/haive-core/tests
    packages/haive-agents/tests
    packages/haive-tools/tests
    packages/haive-games/tests
    packages/haive-prebuilt/tests
    packages/haive-dataflow/tests

# Naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    real_db: Tests that run against a real database
    integration: Integration tests that require external components

# Asyncio handling
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Extra options
addopts = --import-mode=importlib --show-capture=stderr -vv -s
color = yes
verbosity = 1
timeout = 300

# Caching
cache_dir = .pytest_cache
