[pytest]
minversion = 7.0

# Base configuration for all packages
addopts = 
    --asyncio-mode=strict
    -ra
    -vv
    --import-mode=importlib
    --color=yes
    --show-capture=all
    --tb=short
    --showlocals
    --maxfail=5
    --durations=10
    --strict-markers
    --rich
    --rich-summary
    --rich-traceback
    --rich-style monokai

# Common test discovery settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = strict
asyncio_fixture_scope = function

# Common test markers
markers =
    slow: marks tests as slow
    integration: marks integration tests
    smoke: marks smoke tests
    regression: marks regression tests
    unit: marks unit tests
    e2e: marks end-to-end tests
    api: marks API tests
    ui: marks UI tests
    performance: marks performance tests

# Required plugins for all packages
required_plugins =
    pytest-rich>=0.2.0
    pytest-asyncio>=0.21.0
    pytest-clarity>=1.0.1

# Common directories to ignore
norecursedirs =
    .git
    .venv
    dist
    build
    logs
    __pycache__

# Common warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::pytest_asyncio.plugin.PytestDeprecationWarning

# Add the package's source and test directories to the Python path
pythonpath = src tests

# Test discovery settings
testpaths = tests

# Pytest command-line options
adopts = [
    -ra
    -vv
    -s
    --import-mode=importlib
    --color=yes
    --show-capture=all
    --tb=short
    --showlocals
    --maxfail=5
    --html=logs/report.html
    --self-contained-html
    --alluredir=logs/allure-results
    --durations=10
    --strict-markers
]
# Logging configuration
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)
log_file = logs/pytest.log
log_file_level = DEBUG
log_date_format = %Y-%m-%d %H:%M:%S

# HTML report configuration
render_collapsed = failed,error
initial_sort = result
generate_report_on_test = True