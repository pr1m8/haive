# Styles directory and minimum alert level
StylesPath   = .vale/styles
MinAlertLevel = warning

# Default: no styles applied
[*]
BasedOnStyles =

# Python files: apply only Google style to docstrings
[*.py]
BasedOnStyles  = Google
# Only scan triple-quoted strings (docstrings)
Scopes         = docstring
# Don’t scan code tokens
TokenIgnores   =

# Markdown files: apply Google style to prose
[*.md]
BasedOnStyles  = Google

# reStructuredText files: apply Google style
[*.rst]
BasedOnStyles  = Google

# Exclude generated/build directories entirely
[project_docs/build/**]
BasedOnStyles =

[.venv/**]
BasedOnStyles =

[build/**]
BasedOnStyles =

[dist/**]
BasedOnStyles =
