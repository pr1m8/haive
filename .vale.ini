# Vale Configuration for Haive
# Focused on Google-style Python docstrings

StylesPath = .vale/styles
MinAlertLevel = warning

# Global settings - no styles by default
[*]
BasedOnStyles =

# Python docstrings - Google style only
[*.py]
BasedOnStyles = Google
# Only check docstrings, not code
BlockIgnores = (?s)^(?!.*""").*$
TokenIgnores = (\$\$.*?\$\$), (\$.*?\$)

# Markdown - Google style only
[*.md]
BasedOnStyles = Google

# RST - Google style only
[*.rst]
BasedOnStyles = Google

# Ignore build directories
[project_docs/build/*]
BasedOnStyles =

[.venv/*]
BasedOnStyles =

[build/*]
BasedOnStyles =

[dist/*]
BasedOnStyles =
