# Vale Configuration for Haive
# Comprehensive prose linting and style checking

StylesPath = .vale/styles

MinAlertLevel = suggestion

# Global settings
[*]
BasedOnStyles = Microsoft, proselint

# Markdown settings
[*.md]
BasedOnStyles = Microsoft, proselint, write-good

# RST settings
[*.rst]
BasedOnStyles = Microsoft, proselint

# Python docstrings
[*.py]
BlockIgnores = (?s) (```.*?```)
TokenIgnores = (\$\$.*?\$\$), (\$.*?\$)

# Ignore patterns
[project_docs/build/*]
BasedOnStyles =

[.venv/*]
BasedOnStyles =

[build/*]
BasedOnStyles =

[dist/*]
BasedOnStyles =
