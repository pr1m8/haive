# .pre-commit-config.yaml
default_language_version:
  python: python3.12

repos:
  # Basic file hygiene and security hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements
        exclude: |
          (?x)^(
            project_docs/archive/.*|
            project_docs/claude_sessions/.*|
            project_docs/multi_agent_state_design/.*|
            project_docs/check_documentation\.py|
            test_utilities/game_tournaments/.*|
            examples/.*|
            scripts/migration/.*|
            scripts/doc_tools/.*|
            scripts/maintenance/.*|
            docs/source/reference/legacy_project_notes/.*
          )$
      - id: detect-private-key
        exclude: |
          (?x)^(
            docs/source/reference/legacy_project_notes/.*
          )$
      - id: check-case-conflict
      - id: check-docstring-first
        exclude: |
          (?x)^(
            project_docs/.*|
            test_utilities/game_tournaments/.*|
            examples/.*|
            scripts/migration/.*|
            scripts/doc_tools/.*|
            scripts/maintenance/.*|
            docs/source/reference/legacy_project_notes/.*
          )$
      - id: check-executables-have-shebangs
        exclude: |
          (?x)^(
            project_docs/.*|
            test_utilities/game_tournaments/.*|
            examples/.*|
            scripts/migration/.*|
            scripts/doc_tools/.*|
            scripts/maintenance/.*|
            docs/source/reference/legacy_project_notes/.*
          )$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff for fast linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args:
          [
            "--fix",
            "--exit-non-zero-on-fix",
            "--line-length=100",
            "--target-version=py311",
          ]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        args: ["--line-length=100"]
        types_or: [python, pyi, jupyter]

  # MyPy type checking for each package
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        name: mypy-core
        files: ^packages/haive-core/src/
        args:
          [
            "--ignore-missing-imports",
            "--disallow-untyped-defs",
            "--disallow-incomplete-defs",
            "--check-untyped-defs",
            "--warn-redundant-casts",
            "--warn-return-any",
            "--warn-unused-ignores",
          ]
        additional_dependencies:
          - pydantic>=2.4.2
          - types-requests
          - types-PyYAML
          - langchain-core>=0.1.0
          - numpy>=1.24.0
          - pytest>=7.0.0

      - id: mypy
        name: mypy-agents
        files: ^packages/haive-agents/src/
        args: ["--ignore-missing-imports"]
        additional_dependencies:
          - pydantic>=2.4.2
          - types-requests

      - id: mypy
        name: mypy-games
        files: ^packages/haive-games/src/
        args: ["--ignore-missing-imports"]
        additional_dependencies:
          - pydantic>=2.4.2

  # Docstring style enforcement
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=google", "--add-ignore=D100,D104,D107,D203,D213"]
        exclude: ^(tests/|docs/|scripts/)

  # Spell checking for documentation and docstrings
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespellignore", "--skip=*.lock,*.json,*.svg"]



  # Jupyter notebook cleaning
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: ".ipynb$"

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
