# .trunk/trunk.yaml
# See: https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8

lint:
  enabled:
    - actionlint@1.7.7
    - bandit@1.8.6
    - black@25.1.0
    - checkov@3.2.450
    - dotenv-linter@3.3.0
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.45.0
    - mypy@1.16.1
    - osv-scanner@2.0.3
    - oxipng@9.1.5
    - prettier@3.6.2
    - ruff@0.12.2
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - taplo@0.9.3
    - trufflehog@3.89.2
    - yamllint@1.37.1
  ignore:
    - linters: [ALL]
      paths:
        - "**/migrations/**"
        - "**/__pycache__/**"
        - ".history/**"
        - ".venv/**"
        - "node_modules/**"
        - "packages/**"
        - "projects/**"
        - "haive-core/**"
        - "data/**"
        - "docs/**"
        - "resources/**"
        - "assets/**"
        - "dist/**"
        - "build/**"
        - "*.egg-info/**"

actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
# Optional: If your main branch is not "main" or "master", set it here
# repo:
#   trunk_branch: main
