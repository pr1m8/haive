# .trunk/trunk.yaml
# See: https://docs.trunk.io/reference/trunk-yaml
version: 0.1

cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8

lint:
  enabled:
    - pre-commit-hooks@5.0.0
    - actionlint@1.7.7
    - bandit@1.8.6
    - black@25.1.0
    - checkov@3.2.451
    - dotenv-linter@3.3.0
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.45.0
    - mypy@1.17.0
    - osv-scanner@2.0.3
    - oxipng@9.1.5
    - prettier@3.6.2
    - ruff@0.12.3
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - taplo@0.9.3
    - trufflehog@3.90.0
    - yamllint@1.37.1
  definitions:
    - name: isort
      commands:
        - run: isort --profile black ${target}
    - name: black
      commands:
        - run: black --skip-string-normalization ${target}
  ignore:
    - linters: [ALL]
      paths:
        - "**/migrations/**"
        - "**/__pycache__/**"
        - ".history/**"
        - ".venv/**"
        - "node_modules/**"
        - "projects/**"
        - "haive-core/**"
        - "data/**"
        #- "docs/**"
        - "resources/**"
        - "assets/**"
        - "dist/**"
        - "build/**"
        - "*.egg-info/**"
        # Allow packages to be linted now
        - "packages/**/test_*.py"
        - "packages/**/*test*.py"
        - "packages/**/.venv/**"

actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-check-pre-commit
    - git-lfs
    - trunk-upgrade-available
    - haive-import-validation
    - haive-memory-integrity
  definitions:
    - id: haive-import-validation
      display_name: "Haive Import Validation"
      description: "Validate critical Haive imports work correctly"
      triggers:
        - git_hooks: [pre-commit]
      run: |
        echo "🔍 Validating Haive imports..."
        poetry run python -c "
        try:
            from haive.core.engine.aug_llm import AugLLMConfig
            from haive.agents.simple.agent_v3 import SimpleAgentV3
            from haive.core.schema.prebuilt.messages_state import MessagesState
            print('✅ All critical imports successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "
      interactive: optional
      notify_on_error: true

    - id: haive-memory-integrity
      display_name: "Memory System Check"
      description: "Validate CLAUDE.md and memory system integrity"
      triggers:
        - git_hooks: [pre-commit]
      run: |
        echo "🧠 Checking memory system integrity..."
        if [ ! -f "CLAUDE.md" ]; then
          echo "❌ CLAUDE.md missing"
          exit 1
        fi
        if [ ! -d "project_docs" ]; then
          echo "❌ project_docs directory missing"
          exit 1
        fi
        echo "✅ Memory system intact"
      interactive: optional
      notify_on_error: true
# Optional: If your main branch is not "main" or "master", set it here
# repo:
#   trunk_branch: main
