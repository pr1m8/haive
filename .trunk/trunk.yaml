---
# .trunk/trunk.yaml
# See: https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled: [go@1.21.0, node@22.16.0, python@3.10.8]
lint:
  enabled:
    - pre-commit-hooks@5.0.0
    - actionlint@1.7.7
    - bandit@1.8.6
    - black@25.1.0
    - checkov@3.2.451
    - dotenv-linter@3.3.0
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.45.0
    - mypy@1.17.0
    - osv-scanner@2.0.3
    - oxipng@9.1.5
    - prettier@3.6.2
    - ruff@0.12.3
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - taplo@0.9.3
    - trufflehog@3.90.0
    - yamllint@1.37.1
  ignore:
    - linters: [ALL]
      paths:
        - "**/migrations/**"
        - "**/__pycache__/**"
        - .history/**
        - .venv/**
        - node_modules/**
        - data/**
        - scripts/**/dryrun_wrapper.py
        - scripts/**/smart_dryrun_wrapper.py
        - scripts/debug/diagnose_test_performance.py
        - syntax_errors_*.json
        - syntax_errors_*.txt
        - resources/**
        - assets/**
        - dist/**
        - build/**
        - "*.egg-info/**"
        - docs/source/conf.py
        - docs/source/conf_modules/**
actions:
  disabled:
    - trunk-announce # Disable announcements only
  enabled:
    - git-lfs
    - trunk-fmt-pre-commit # ✅ Auto-format on commit
    - trunk-check-pre-push # ✅ Check before push
    - trunk-cache-prune
    - trunk-upgrade-available
    - run-pre-commit # Custom action to run your .pre-commit-config.yaml
  output_level: verbose
  definitions:
    - id: run-pre-commit
      display_name: Run project’s pre-commit hooks
      description: Invoke pre-commit against changed files
      triggers:
        - git_hooks: [pre-commit]
      run: pre-commit run --files $TRUNK_CHANGED_FILES
      interactive: false
      notify_on_error: false
