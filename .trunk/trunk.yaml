# .trunk/trunk.yaml
# See: https://docs.trunk.io/reference/trunk-yaml

version: 0.1

cli:
  version: 1.22.12
plugins:
  sources:
    - id: trunk
      ref: v1.6.8
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - go@1.21.0
    - node@18.20.5
    - python@3.10.8

lint:
  enabled:
    - actionlint@1.7.7
    - bandit@1.8.3
    - black@25.1.0
    - checkov@3.2.407
    - dotenv-linter@3.3.0
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.44.0
    - mypy@1.15.0
    - osv-scanner@2.0.1
    - oxipng@9.1.4
    - prettier@3.5.3
    - ruff@0.11.6
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - taplo@0.9.3
    - trufflehog@3.88.25
    - yamllint@1.37.0
  ignore:
    - linters: [ALL]
      paths:
        - "**/migrations/**"
        - "**/__pycache__/**"
        - ".history/**"

actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
# Optional: If your main branch is not "main" or "master", set it here
# repo:
#   trunk_branch: main
