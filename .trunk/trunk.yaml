# .trunk/trunk.yaml
# Purpose: Use Trunk's full-repo pre-commit/pre-push hooks with optional pre-commit integration

version: 0.1

cli:
  version: 1.24.0

plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8

lint:
  enabled:
    - codespell@2.4.1
    - flake8@7.3.0
    - pyright@1.1.403
    - vale@3.12.0
    - pre-commit-hooks@5.0.0
    - actionlint@1.7.7
    - bandit@1.8.6
    - black@25.1.0
    - checkov@3.2.457
    - dotenv-linter@3.3.0
    - git-diff-check
    - hadolint@2.12.1-beta
    - isort@6.0.1
    - markdownlint@0.45.0
    - mypy@1.17.1
    - osv-scanner@2.0.3
    - oxipng@9.1.5
    - prettier@3.6.2
    - ruff@0.12.7
    - shellcheck@0.10.0
    - shfmt@3.6.0
    - taplo@0.9.3
    - trufflehog@3.90.2
    - yamllint@1.37.1

  ignore:
    - linters: [ALL]
      paths:
        - "**/migrations/**"
        - "**/__pycache__/**"
        - .history/**
        - .venv/**
        - node_modules/**
        - data/**
        - resources/**
        - assets/**
        - dist/**
        - build/**
        - "*.egg-info/**"
        - syntax_errors_*.json
        - syntax_errors_*.txt
        - docs/source/conf.py
        - docs/source/conf_modules/**
        - scripts/**/dryrun_wrapper.py
        - scripts/**/smart_dryrun_wrapper.py
        - scripts/debug/diagnose_test_performance.py

actions:
  output_level: verbose

  disabled:
    - trunk-announce # silence Trunk marketing messages

  enabled:
    - git-lfs
    - trunk-cache-prune
    - trunk-upgrade-available
    - trunk-fmt-pre-commit # ✅ built-in full-repo formatter on commit
    - trunk-check-pre-push # ✅ built-in full-repo checker on push
    - run-pre-commit-hook # ✅ integration with .pre-commit-config.yaml

  definitions:
    - id: run-pre-commit-hook
      display_name: Run pre-commit YAML hooks
      description: Run `.pre-commit-config.yaml` against staged changes
      triggers:
        - git_hooks: [pre-commit]
      run: |
        FILES=$(git diff --cached --name-only | grep -v '^$' || true)
        if [ -z "$FILES" ]; then
          echo "✅ No staged files to lint with pre-commit"
          exit 0
        fi
        echo "🔧 Running pre-commit on staged files..."
        pre-commit run --files $FILES
      interactive: false
      notify_on_error: false
