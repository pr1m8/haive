[tool:monkeytype]
# MonkeyType configuration for Haive
# Generates type annotations from runtime analysis

# Paths to analyze
include_paths = packages/*/src

# Patterns to exclude
exclude_patterns =
    */tests/*
    */examples/*
    */__pycache__/*
    */build/*
    */dist/*

# Database configuration
trace_store = monkeytype.sqlite3

# Output format
stub_out_dir = .monkeytype_stubs

# Type inference settings
apply_annotations_to_file = true
type_rewriter = monkeytype.stubs:MypyStubsRewriter
