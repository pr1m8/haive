---
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install poetry
    post_install:
      - pip install -e packages/haive-core[docs]
      - pip install -e packages/haive-agents
      - pip install -e packages/haive-games
      - pip install -e packages/haive-tools
      - pip install -e packages/haive-prebuilt
      - pip install -e packages/haive-dataflow
sphinx:
  configuration: docs/source/conf.py
