[tool.poetry]
name = "haive"
version = "1.0.1"
description = "Production-ready AI agent framework — meta-package installing the full Haive ecosystem (53+ agents, 22+ RAG variants, 23 game environments, memory + KG, MCP integration)"
authors = ["pr1m8 <william.astley@algebraicwealth.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/pr1m8/haive"
repository = "https://github.com/pr1m8/haive"
documentation = "https://pr1m8.github.io/haive-core/"
keywords = ["ai", "agents", "llm", "langchain", "langgraph", "multi-agent", "rag", "memory", "knowledge-graph"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "haive_meta", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
haive-core = "^1.0.1"
haive-agents = "^1.0.1"
haive-games = "^1.0.1"
haive-tools = "^1.0.1"
haive-mcp = "^1.0.1"
haive-hap = "^1.0.1"
haive-dataflow = "^1.0.1"
haive-prebuilt = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
