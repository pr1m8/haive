site_name: Agents Framework
site_url: https://yourwebsite.com
repo_url: https://github.com/your-username/agents
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    scheme: slate  # Dark mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Agents:
      - Overview: agents/index.md
      - Agent 1: agents/agent-1.md
      - Agent 2: agents/agent-2.md
  - API Reference: api.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            heading_level: 2
  - git-revision-date-localized
  - autorefs
  - markdownextradata

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/agents

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - abbr

watch:
  - docs
  - src/agents
